<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DriftSim</title>
	<meta name="description" content="An interactive genetic drift simulation. No color is better — one still takes over. Watch chance do it.">

	<!-- icons (copy the logo kit into web/ next to this file) -->
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
	<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
	<meta name="theme-color" content="#1a1a1f">

	<!-- link previews (Discord, iMessage, Slack, Twitter) -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://driftsim.app/">
	<meta property="og:title" content="DriftSim">
	<meta property="og:description" content="An interactive genetic drift simulation. No color is better — one still takes over. Watch chance do it.">
	<meta property="og:image" content="https://driftsim.app/driftsim-og-1200x630.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="DriftSim">
	<meta name="twitter:description" content="An interactive genetic drift simulation.">
	<meta name="twitter:image" content="https://driftsim.app/driftsim-og-1200x630.png">

	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>


	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #1a1a1f;
			color: #f7f7fa;
			font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
		}
		#canvas {
			display: block;
			margin: 0;
			color: #1a1a1f;
			outline: none;
		}
		#canvas:focus { outline: none; }

		/* loading screen: three blobs that pulse in sequence, then the bar */
		#status {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 22px;
			background: #1a1a1f;
			visibility: hidden;
		}
		#status-blobs { display: flex; gap: 22px; }
		.blob {
			width: 46px; height: 46px; border-radius: 50%;
			position: relative;
			animation: pulse 1.5s ease-in-out infinite;
		}
		.blob::after {
			content: ""; position: absolute;
			width: 13px; height: 13px; border-radius: 50%;
			background: #f7f7fa; top: 14px; left: 16px;
			box-shadow: inset 0 0 0 4px #f7f7fa, inset 0 0 0 7px #14141a;
		}
		.blob.r { background: #e66161; }
		.blob.g { background: #6bcc7a; animation-delay: .25s; }
		.blob.b { background: #6b9ef2; animation-delay: .5s; }
		@keyframes pulse {
			0%, 100% { transform: translateY(0) scale(1); opacity: .85; }
			50%      { transform: translateY(-8px) scale(1.06); opacity: 1; }
		}
		#status-title { font-weight: 800; font-size: 28px; letter-spacing: .2px; }
		#status-progress {
			width: 220px; height: 6px; border-radius: 3px;
			background: #2a2a31; overflow: hidden;
		}
		#status-progress-inner {
			height: 100%; width: 0%;
			background: #6b9ef2; border-radius: 3px;
			transition: width .15s ease-out;
		}
		#status-notice {
			max-width: 420px; text-align: center;
			font-size: 14px; line-height: 1.5; color: #9a9aa8;
			padding: 0 16px;
		}
		#status-notice.error { color: #e66161; }
	</style>
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<div id="status-blobs">
			<div class="blob r"></div>
			<div class="blob g"></div>
			<div class="blob b"></div>
		</div>
		<div id="status-title">DriftSim</div>
		<div id="status-progress"><div id="status-progress-inner"></div></div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":837444,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusProgressInner = document.getElementById('status-progress-inner');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) {
					return;
				}
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				statusProgress.style.visibility = mode === 'progress' ? 'visible' : 'hidden';
				statusNotice.style.visibility = mode === 'notice' ? 'visible' : 'hidden';
				statusMode = mode;
			}

			function setStatusNotice(text, isError) {
				statusNotice.textContent = text;
				statusNotice.classList.toggle('error', !!isError);
			}

			function displayFailureNotice(err) {
				console.error(err);
				const msg = (err && err.message) ? err.message : String(err);
				setStatusNotice(msg, true);
				setStatusMode('notice');
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});

			if (missing.length !== 0) {
				if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
					let serviceWorkerRegistrationPromise;
					try {
						serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
					} catch (err) {
						serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
					}
					Promise.race([
						serviceWorkerRegistrationPromise.then((registration) => {
							if (registration != null) {
								return Promise.reject(new Error('Service worker already exists.'));
							}
							return registration;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => {
							setTimeout(() => resolve(), 2000);
						}),
					]).then(() => {
						window.location.reload();
					}).catch((err) => {
						console.error('Error while registering service worker:', err);
					});
				} else {
					const missingMsg = 'This browser is missing something the sim needs:\n' + missing.join('\n');
					displayFailureNotice(missingMsg);
				}
			} else {
				setStatusMode('progress');
				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							statusProgressInner.style.width = `${(current / total) * 100}%`;
						} else {
							statusProgressInner.style.width = '30%';
						}
					},
				}).then(() => {
					setStatusMode('hidden');
				}, displayFailureNotice);
			}
		}());
	</script>
</body>
</html>
